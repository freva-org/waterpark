# /etc/nginx/conf.d/catalogue.conf
# Landing page: waterpark.dkrz.de → static mkdocs-material site
# Also handles the HTTP→HTTPS redirect for both vhosts (default_server).
#
# Deploy static content:
#   git clone --branch gh-pages --single-branch --depth 1 \
#       https://github.com/freva-org/grid-doctor.git \
#       /usr/share/nginx/html/waterpark
#
# Update later with: git -C /usr/share/nginx/html/waterpark pull

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 301  https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name waterpark.dkrz.de;

    include default.d/ssl-waterpark.conf;
    include default.d/block-sensitive-paths.conf;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "frame-ancestors 'self' https://pad.gwdg.de https://*.gwdg.de;" always;

    access_log /var/log/nginx/catalogue-access.log main;
    error_log  /var/log/nginx/catalogue-error.log notice;

    root  /usr/share/nginx/html/waterpark;
    index index.html;

    # Maintenance mode: touch /etc/nginx/maintenance.enable to activate,
    # rm it to deactivate. No reload needed.
    set $maintenance 0;
    if (-f /etc/nginx/maintenance.enable) {
        set $maintenance 1;
    }
    if ($maintenance = 1) {
        return 503;
    }

    error_page 503 /503.html;
    error_page 404 /404.html;
    location = /503.html { internal; }
    location = /404.html { internal; }

    # Deny access to .git (and any other dotfiles). The repo stays on
    # disk so `git -C ... pull` keeps working; nginx just won't serve it.
    location ~ /\.(?!well-known) {
	    return 404;
    }

    # mkdocs-material hashed assets — cache aggressively
    location ~* \.(css|js|woff2?|png|svg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location = /robots.txt { expires 10m; add_header Cache-Control "public" always; }
    # mike publishes each release into its own directory. Those are immutable
    # once written -- 0.5.0 will never change -- so they can be cached hard.
    # `latest` and `dev` are aliases that move, and must not be.
    location ~ ^/tech/[^/]+/\d+\.\d+ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri $uri/ =404;
    }

    location ~ ^/tech/[^/]+/(latest|dev)/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }


    # Everything else — static file serving
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
