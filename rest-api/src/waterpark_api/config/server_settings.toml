# This is the default server config file, you can adjust the
# settings if necessary.

# The port where the restAPI will be running at
[port]
default = 8080
description = "The port the restAPI will be running on."
type = "integer"

[db_host]
default = ""
description = "Set the database hostname"
type = "string"

[db_port]
default = 3306
description = "Set the database port"
type = "integer"


[db_type]
default = "sqlite"
description = "Set the type of the db connection."
type = "string"

[db_name]
default = "waterpark_backend"
description = "Set the path to the sqlite db or db name."
type = "string"

[db_username]
default = ""
description = "Set the username for the db connection (mysql and postgresql only)"
type = "string"

[db_password]
default = ""
description = "Set the password for the db connection (mysql and postgresql only)."


[db_connect_string]
default = ""
description = "Set the SQLAlchemy connection string."


[email_server]
default = "smtp.sendgrid.net"
description = "SMTP mail host."
type = "string"

[email_port]
default = 587
description = "SMTP email connection port 25 for postfix"
type = "integer"

[email_user]
default = "apikey"
description = "SMTP email user name"
type = "string"

[email_password]
default = ""
description = "SMTP email password."
type = "string"

[email_from_address]
default = "hello@waterpark.dkrz.de"
description = "From address for sending emails."
type = "string"

[email_from_name]
default = "Waterpark admin"
description = "Display name for from address."
type = "string"

[email_disabled]
default = false
description = "Disable sending emails."
type = "bool"

[base_url]
default = "https://waterpark.dkrz.de"
description = "Public URL of the site. Used to build links inside emails."

[api_url]
description = """Origin serving /api. Empty means same origin as base_url,
which is the case in production behind nginx. Set it in development,
where the docs are on :8000 and the API on :8080."""
default = ""

[cors_origins]
default = []
description = """Origins allowed to call the API cross-site. Leave empty in
production, where nginx serves the site and the API on one origin."""
type = "string[]"

[announcements_path]
default = "/var/lib/waterpark/announcements.toml"
description = "TOML file holding site announcements. Read on demand; edit it to publish, no restart or rebuild needed."
type = "path"
