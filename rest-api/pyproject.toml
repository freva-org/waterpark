[build-system]
requires = ["flit_core >=3.2"]
build-backend = "flit_core.buildapi"
[project]
name = "waterpark_api"
dynamic = ["version"]
description = "Backend for the Waterpark server."
readme = "README.md"
authors = [{name = "Waterpark", email = "waterpark@support.dkrz.de"}]
classifiers = [
               "Development Status :: 4 - Beta",
               "Environment :: Console",
               "Intended Audience :: Developers",
               "Intended Audience :: Science/Research",
               "Operating System :: POSIX :: Linux",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "email-validator",
    "fastapi",
    "platformdirs",
    "pydantic",
    # uvicorn only honours the --env-file the CLI writes if this is present
    "python-dotenv",
    # imported by SQLAlchemy, not by us, but required for those backends
    "psycopg2-binary",
    "pymysql",
    # required by FastAPI to parse Form(...) bodies; without it the
    # newsletter routes fail at registration time, not at request time
    "python-multipart",
    "rich-argparse",
    "rich",
    "sqlalchemy",
    "toml",
    "uvicorn",
]
[project.scripts]
waterpark-api = "waterpark_api.cli:cli_app"
[project.urls]
Documentation = "https://waterpark.dkrz.de"
Issues = "https://github.com/freva-org/waterpark/issues"
Source = "https://github.com/freva-org/waterpark"

[project.optional-dependencies]
dev = ["tox", "isort", "black", "pre-commit"]
tests = [
    "httpx",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov",
    "respx",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "stack: needs a running compose stack; set WATERPARK_STACK_URL to enable",
]
# The stack tests are skipped without WATERPARK_STACK_URL anyway, but this
# keeps them out of the default run's collection noise.
addopts = "-ra"

[tool.isort]
known_first_party = ["waterpark_api"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.coverage.report]
ignore_errors = false
exclude_lines = [
  "pragma: no cover",
  "noqa",
  "def __call__",
  "def __repr__",
  "if self\\.debug",
  "def _post_url\\(self\\)",
  "raise AssertionError",
  "raise NotImplementedError",
  "except KeyboardInterrupt:",
  "except ImportError:",
  "except RuntimeError",
  "raise SystemExit",
  "except OSError:",
  "except Exception as error:",
  "except errors.BulkWriteError as bwe:",
  "except Exception:",
  "class Completer",
  "if 0:",
  "if perf_file *:",
  "p_col = *",
  "f_col = *",
  "q_col = *",
  "if __name__ == .__main__.:",
]

[tool.mypy]
files = "src"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
allow_untyped_calls = true

[tool.pydocstyle]
convention = "google"
add-ignore = "D407, D105, D104"

[tool.codespell]
skip = ".git,.tox,build,dist,*.svg,*.min.js,*.lock,*.ico,.mypy_cache,.ruff_cache,.venv"
ignore-words-list = "te,nd,fo,ist"
ignore-words = ".codespellignorewords.txt"
check-filenames = true
check-hidden = true



# --------------------------------------------------------------------------
# tox
#
# Native TOML config, not the old `legacy_tox_ini = """..."""` string: real
# tables, real comments, and the editor stops treating it as opaque text.
# Requires tox >= 4.21; older versions do not read this table and will
# report that no config was found.
#
#   tox -l          list environments
#   tox -e dev      run the API with autoreload
# --------------------------------------------------------------------------

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["lint", "types", "test"]

[tool.tox.env_run_base]
# The dev env is configured through WATERPARK_* variables, and the
# orchestrating Makefile one directory up sets some of them. Without this
# tox would scrub them from the environment.
pass_env = ["*"]

[tool.tox.env.dev]
description = "Run the API with autoreload against a local sqlite db."
package = "editable"
deps = [".[tests]"]
commands_pre = [
    ["python", "-c", "import os, pathlib; pathlib.Path(os.environ['WATERPARK_DB_NAME']).parent.mkdir(parents=True, exist_ok=True)"],
    # Seed local.toml from the template on first run. Without this the app
    # seeds it from the shipped production defaults, which point at
    # sendgrid rather than at the local mailbox.
    ["python", "-c", "import os, pathlib, shutil; p = pathlib.Path(os.environ['WATERPARK_CONFIG_PATH']); src = pathlib.Path('local.toml.example'); (print('seeded', p, 'from', src) or shutil.copy(src, p)) if not p.exists() else None"],
]
commands = [
    ["python", "-m", "uvicorn", "waterpark_api.main:app",
     "--host", "{env:WATERPARK_HOST:127.0.0.1}",
     "--port", "{env:WATERPARK_PORT:8080}",
     "--reload", "--reload-dir", "{tox_root}/src"],
]

# Every value is {env:VAR:default}, so this env stands on its own when you
# run `tox -e dev` here, and the top-level Makefile can still override any
# of it. Plain assignments would win over the outer environment instead.
[tool.tox.env.dev.set_env]
WATERPARK_DB_TYPE = "{env:WATERPARK_DB_TYPE:sqlite}"
WATERPARK_DB_NAME = "{env:WATERPARK_DB_NAME:{tox_root}/.dev/waterpark}"
WATERPARK_ANNOUNCEMENTS_PATH = "{env:WATERPARK_ANNOUNCEMENTS_PATH:{tox_root}/.dev/announcements.toml}"
# No WATERPARK_EMAIL_* here on purpose. The environment outranks the
# config file, so setting them at this level would silently override
# whatever you put in local.toml -- which is precisely the file people
# reach for to point dev mail at their own account. Mail settings live in
# local.toml, seeded from local.toml.example by commands_pre below.
# The app logger defaults to ERROR, which hides every "sent verification
# to X" and every "address rejected" line -- exactly what you need when a
# mail does not arrive. 2 means INFO, 3 means DEBUG.
VERBOSITY = "{env:VERBOSITY:2}"
# Keep the rotating log file with the rest of the dev state instead of in
# ~/.local/state, so `make clean` takes it with everything else.
WATERPARK_LOGDIR = "{env:WATERPARK_LOGDIR:{tox_root}/.dev/logs}"
# Local settings, gitignored. Seeded with every documented default on the
# first run, so `tox -e dev` once and then edit the email block to point
# at your own SMTP account. Deliberately NOT under .dev/, which `make
# clean` removes -- credentials should survive a clean.
WATERPARK_CONFIG_PATH = "{env:WATERPARK_CONFIG_PATH:{tox_root}/local.toml}"

[tool.tox.env.test]
description = "Run the test suite."
package = "editable"
deps = [".[tests]"]
commands = [
    ["pytest", "-vv", "--cov=waterpark_api", "--cov-report=html:coverage_report",
     "--junitxml", "report.xml", "--cov-report", "xml",
     "-m", "not stack", "{posargs:tests/}"],
    ["python3", "-m", "coverage", "report", "--precision=2"],
]

[tool.tox.env.stack]
description = "Run the end-to-end tests against a stack that is already up."
package = "editable"
deps = [".[tests]"]
pass_env = ["*"]
set_env = { WATERPARK_STACK_URL = "{env:WATERPARK_STACK_URL:http://localhost:8000}" }
commands = [["pytest", "-vv", "-m", "stack", "{posargs:tests/test_stack.py}"]]

[tool.tox.env.lint]
description = "Style, spelling and security checks."
skip_install = true
deps = ["bandit[toml]", "black", "codespell", "flake8", "isort", "pydocstyle"]
allowlist_externals = ["codespell"]
commands = [
    ["python3", "-m", "isort", "--check", "--profile", "black", "-t", "py313", "-l", "79", "src"],
    ["python3", "-m", "flake8", "src", "--count", "--max-complexity=10",
     "--ignore=E203,F405,F403,E704,W503,C901", "--max-line-length=88",
     "--statistics", "--show-source"],
    ["codespell", "{posargs:--quiet-level=2}", "src/waterpark_api"],
    ["python3", "-m", "pydocstyle", "src/waterpark_api"],
    ["bandit", "-r", "src/waterpark_api", "--skip", "B110",
     "--severity-level", "medium", "--confidence-level", "high"],
]

[tool.tox.env.format]
description = "Apply black and isort rather than just reporting."
skip_install = true
deps = ["black", "isort"]
commands = [
    ["python3", "-m", "isort", "--profile", "black", "-t", "py313", "-l", "79", "src"],
    ["python3", "-m", "black", "-l", "79", "src"],
]

[tool.tox.env.types]
description = "Static type checking."
deps = [".", "mypy", "types-toml", "pytest-stub"]
commands = [["mypy", "--install-types", "--non-interactive"]]
