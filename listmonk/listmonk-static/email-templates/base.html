{{ define "header" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Waterpark</title>
  <style>
    body { margin: 0; padding: 0; background: #fafbfa; color: #5a6b63; font-family: Arial, Helvetica, sans-serif; }
    h2 { color: #00504a; font-size: 22px; line-height: 1.35; }
    p, li { font-size: 16px; line-height: 1.6; }
    a { color: #00504a; }
    img { border: 0; outline: none; max-width: 100%; }
    .button { display: inline-block; padding: 16px 32px; border-radius: 6px; background: #f9b913; color: #00504a !important; font-size: 16px; font-weight: bold; text-decoration: none; }
    .button:hover { background: #e5a811 !important; }
    @media only screen and (max-width: 620px) {
      .wp-outer { padding: 20px 12px !important; }
      .wp-content { padding: 28px 24px !important; }
      .wp-header { padding: 30px 24px 24px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#fafbfa; color:#5a6b63; font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fafbfa">
    <tr>
      <td class="wp-outer" align="center" style="padding:40px 20px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,80,74,0.08);">
          <tr>
            <td class="wp-header" align="center" bgcolor="#00504a" style="padding:36px 40px 28px; background-color:#00504a; background-image:linear-gradient(135deg,#00504a 0%,#00695f 100%); border-radius:12px 12px 0 0;">
              {{ if ne LogoURL "" }}
              <img src="{{ LogoURL }}" width="60" height="60" alt="" style="display:block; width:60px; height:60px; margin:0 auto 16px; border:0; outline:none; text-decoration:none;">
              {{ end }}
              <h1 style="margin:0; color:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-0.5px;">Waterpark</h1>
            </td>
          </tr>
          <tr>
            <td class="wp-content" style="padding:40px; color:#5a6b63; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:1.6;">
{{ end }}

{{ define "footer" }}
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#f5f7f6" style="padding:24px; background-color:#f5f7f6; border-radius:0 0 12px 12px; color:#5a6b63; font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:1.5;">
              <p style="margin:0; font-size:13px; line-height:1.5;">The Waterpark team at DKRZ</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
{{ end }}
