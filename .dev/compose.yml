---
# Waterpark development stack.
#
#   docker compose up          (or: podman-compose up)
#
#   http://localhost:8000            the site
#   http://localhost:8000/newsletter/    the signup form, posting to listmonk
#   http://localhost:8000/lists/     listmonk's admin UI
#   http://localhost:8000/mailbox/   mailpit, catches every outgoing mail
#
# One published port, as before. The difference from the previous stack is
# what sits behind it: listmonk and Postgres instead of a FastAPI service,
# and the announcement banner served straight off a file.
#
# Shaped like production on purpose, even though a laptop does not need
# it. The things that break on deployment are the seams -- the proxy paths,
# the subscription form's field names, where the banner file lives -- and
# those only get exercised if the layout matches.

name: waterpark-dev

networks:
  waterpark:
    driver: bridge

services:

  # --- single entry point --------------------------------------------------
  # Caddy here, nginx in production. Different software, same routing table:
  # the paths below are the contract, and rest-api/nginx.conf has to grow
  # the same three locations.
  proxy:
    image: docker.io/library/caddy:2-alpine
    networks: [waterpark]
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      # The announcement banner. A file, not a service: editing it is the
      # whole publishing workflow, and the site picks it up on the next
      # page load. In production this is /var/lib/waterpark.
      - ./announcements:/srv/announcements:ro,z
    depends_on:
      docs:
        condition: service_healthy
      listmonk:
        condition: service_started
    restart: unless-stopped

  # --- the docs ------------------------------------------------------------
  docs:
    networks: [waterpark]
    build:
      context: ../landingpage
      dockerfile: Containerfile.dev
    volumes:
      - ../landingpage/data:/work/data:ro,z
      - ../landingpage/shared:/work/shared:ro,z
      - ../landingpage/assets:/work/assets:ro,z
      - ../landingpage/scripts:/work/scripts:ro,z
      - ../landingpage/mkdocs.yml:/work/mkdocs.yml:ro,z
      - docs-build:/work/.build
      - npm-cache:/root/.npm
    environment:
      GRID_DOCTOR_ROOT: /work
      WATERPARK_BASE_PATH: /
      WP_LIST_UUID: "21403ce5-ad9a-439f-a132-f0ca409db1f7"
      SKIP_ASSET_BUILD: "${SKIP_ASSET_BUILD:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000').read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # --- the newsletter ------------------------------------------------------
  listmonk:
    image: docker.io/listmonk/listmonk:latest
    networks: [waterpark]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      # Reached through the proxy, so listmonk has to generate links under
      # the public URL rather than under its own container name. The
      # unsubscribe link in every message comes from this.
      LISTMONK_app__root_url: http://localhost:8000
      LISTMONK_db__host: postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # Development only. In production this is a Keycloak login through
      # listmonk's own OIDC support, with the custom flow rejecting anyone
      # outside the admin group before a session is ever created.
      LISTMONK_ADMIN_USER: waterpark
      LISTMONK_ADMIN_PASSWORD: waterpark-dev-only
    volumes:
      - ../listmonk/listmonk-static:/listmonk/custom-static:ro,z
    command:
      - sh
      - -c
      - |
        ./listmonk --install --idempotent --yes --config '' &&
        ./listmonk --upgrade --yes --config '' &&
        exec ./listmonk --config '' --static-dir=/listmonk/custom-static
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    networks: [waterpark]
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Restored only when the data directory is empty, which is exactly
      # when listmonk would otherwise come up with default settings and a
      # freshly generated list UUID. See `make seed-dump`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # listmonk's --install fails confusingly if it starts before the
      # database accepts connections, so this gate is load-bearing.
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # --- outgoing mail, caught not delivered ---------------------------------
  mailbox:
    image: docker.io/axllent/mailpit:latest
    networks: [waterpark]
    environment:
      MP_WEBROOT: /mailbox
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    restart: unless-stopped

volumes:
  docs-build:
  npm-cache:
  postgres-data:
