# Installed at /opt/waterpark/catalogue.conf and sourced by the
# service: the ingest host needs no credentials here those live
# in catalogue.env next to it.

# CI crawls S3 and publishes the catalogue as a workflow artifact.
# This host only downloads it, so it needs no access to the object store.
REPOSITORY=freva-org/waterpark
WORKFLOW=catalogue.yml
BRANCH=main
ARTIFACT=catalogue

EXECUTABLE=/opt/crawler/bin/metadata-crawler
SERVERS="nextgems.dkrz.de:8983 regiklim-dev.dkrz.de:8983"
BATCH_SIZE=5000
HTTP_WORKERS=2
MAX_FAILED_BATCHES=0
# Seconds one dataset may spend being indexed into one server.
INDEX_TIMEOUT=1800

DATASET_FIELD=dataset

# Another project rotates these servers and deletes our documents. How many
# repairs an hour are allowed before it waits for the next pull.
MAX_REPAIRS_PER_HOUR=3

# Hours since a dataset was last crawled; not since we last saw a snapshot
# mention it, which a carried-forward dataset resets.
WARN_AFTER=30
CRITICAL_AFTER=96

# How long a command waits for another to finish before giving up.
LOCK_WAIT=1800
