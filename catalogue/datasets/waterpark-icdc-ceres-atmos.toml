# ============================================================================
# ICDC / CERES
# s3://icdc/healpix/atmosphere/CERES/*/level_*.zarr/
# example: s3://icdc/healpix/atmosphere/CERES/PT1H/level_0.zarr/
# ============================================================================

[waterpark-icdc-ceres]
fs_type = "s3"
root_path = "s3://icdc/healpix/atmosphere/CERES/"
drs_format = "waterpark-icdc-ceres"
glob_pattern = "level_*.zarr"
[waterpark-icdc-ceres.storage_options]
endpoint_url = "https://s3.waterpark.dkrz.de"
anon = true
[waterpark-icdc-ceres.defaults]
project = "waterpark"
product = "icdc"
realm = "atmosphere"
experiment = "CERES"
model = "ceres"
institute = "nasa-larc"
stac_collection_title = "product|ICDC Satellite Observations (HEALPix)"
stac_collection_description = "product|Satellite remote-sensing climate products curated by the Integrated Climate Data Center (ICDC), University of Hamburg (CERES radiation, GPM/IMERG precipitation, MODIS, ORAS5), remapped to HEALPix and served as Zarr. The thumbnail comes from https://www.nature.com/articles/s41467-021-23321-7"
stac_collection_documentation_url = "product|https://www.cen.uni-hamburg.de/en/icdc.html"
stac_collection_keywords = "product|remote sensing"
stac_collection_thumbnail_url = "product|https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41467-021-23321-7/MediaObjects/41467_2021_23321_Fig2_HTML.png?as=webp"
stac_collection_thumbnail_type = "product|image/png"
[drs_settings.dialect.waterpark-icdc-ceres]
sources = ["path", "data"]
[drs_settings.dialect.waterpark-icdc-ceres.path_specs]
dir_parts = ["time_frequency_raw"]
file_parts = ["_", "level_type"]
[drs_settings.dialect.waterpark-icdc-ceres.data_specs]
read_kws = { consolidated = true, decode_times = true }
[drs_settings.dialect.waterpark-icdc-ceres.data_specs.globals]
institute  = "institution"
grid_id = "healpix_nside"
grid_label = "healpix_order"
[drs_settings.dialect.waterpark-icdc-ceres.data_specs.var_attrs.variable]
var = "*"
attr = "short_name"
default = "__name__"
[drs_settings.dialect.waterpark-icdc-ceres.data_specs.stats.time]
stat = "range"
coords = "time"
default = ["1970-01-01", "1970-01-01"]
[drs_settings.special.time_frequency]
type = "call"
call = '''
(lambda value: {
    "PT15M": "15min",
    "15M":   "15min",
    "PT30M": "30min",
    "30M":   "30min",
    "PT1H":  "1hr",
    "PT3H":  "3hr",
    "PT6H":  "6hr",
    "P1D":   "day",
    "1D":    "day",
    "1DAY":  "day",
    "P1M":   "mon",
    "P1Y":   "yr",
}.get(value.strip().upper(), value.strip().lower()))(
    {{ time_frequency_raw | default("", true) | tojson }}
)
'''
