# ============================================================================
# nextGEMS
# s3://nextgems/healpix/<experiment>/<time_frequency>/level_*.zarr
# example: s3://nextgems/healpix/ngc3028/P1D/level_0.zarr
# ============================================================================

[waterpark-nextgems]
fs_type = "s3"
root_path = "s3://nextgems/healpix/"
drs_format = "waterpark-nextgems"
glob_pattern = "level_*.zarr"
[waterpark-nextgems.storage_options]
endpoint_url = "https://s3.waterpark.dkrz.de"
anon = true
[waterpark-nextgems.defaults]
project = "waterpark"
product = "nextgems"
model = "ICON"
institute = "mpi-m"
realm = "atmosphere"
stac_collection_title = "product|nextGEMS (HEALPix)"
stac_collection_description = "product|Kilometre-scale Earth-system simulations from the Horizon 2020 project nextGEMS (Next Generation Earth Modelling Systems), produced with the ICON and IFS-FESOM models, remapped to HEALPix and served as Zarr. The thumbnail comes from https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025GL120583?af=R"
stac_collection_documentation_url = "product|https://nextgems-h2020.eu/"
stac_collection_keywords = "product|ICON"
stac_collection_thumbnail_url = "product|https://agupubs.onlinelibrary.wiley.com/cms/asset/2b507bb8-2a1f-435b-adf1-6f5a25b4b154/grl72779-fig-0004-m.jpg"
stac_collection_thumbnail_type = "product|image/jpeg"
[drs_settings.dialect.waterpark-nextgems]
sources = ["path", "data"]
[drs_settings.dialect.waterpark-nextgems.path_specs]
dir_parts  = ["experiment", "time_frequency_raw"]
file_parts = ["_", "level_type"]
[drs_settings.dialect.waterpark-nextgems.data_specs]
read_kws = { consolidated = true, decode_times = false }
[drs_settings.dialect.waterpark-nextgems.data_specs.globals]
institute  = "institution"
grid_id = "healpix_nside"
grid_label = "healpix_order"
[drs_settings.dialect.waterpark-nextgems.data_specs.var_attrs.variable]
var = "*"
attr = "short_name"
default = "__name__"
[drs_settings.special.time_frequency]
type = "call"
call = '''
(lambda value: {
    "PT15M": "15min",
    "15M":   "15min",
    "PT30M": "30min",
    "30M":   "30min",
    "PT1H":  "1hr",
    "PT3H":  "3hr",
    "PT6H":  "6hr",
    "P1D":   "day",
    "1D":    "day",
    "1DAY":  "day",
    "P1M":   "mon",
    "P1Y":   "yr",
}.get(value.strip().upper(), value.strip().lower()))(
    {{ time_frequency_raw | default("", true) | tojson }}
)
'''
