name: smoke

# End-to-end check of the real stack: brings up the compose file a
# developer uses, then drives the whole double opt-in flow through the
# proxy exactly as a browser would.
#
# No extra port is exposed for this. The mailbox sits behind the same
# proxy at /mailbox/, so its API is reachable on :8000 like everything
# else -- which also means this test exercises the routing, not just the
# application.

on:
  push:
    branches: [main]
    paths:
      - "landingpage/**"
      - ".dev/**"
      - "api/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "landingpage/**"
      - ".dev/**"
      - "api/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .dev/compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        # No configuration step: with dev/secrets empty the API mails the
        # local mailbox, which is exactly the shape a developer gets.
        run: $COMPOSE up --build -d

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: API tests
        run: |
          pip install -r api/requirements.txt pytest
          cd api && pytest -q

      - name: Remapping weights against the stack
        run: python .dev/smoke-remapweights.py

      - name: Logs
        if: always()
        run: |
          for svc in proxy docs api keycloak s3 mailbox; do
            echo "::group::$svc"
            $COMPOSE logs --tail 100 "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes
