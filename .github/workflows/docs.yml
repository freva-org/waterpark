name: docs

# The landing page. Builds on every PR that touches it, and publishes to
# gh-pages from main. `workflow_dispatch` lets you rebuild and republish
# from the Actions tab without pushing anything, which is what you want
# after a shared-docs sync or when the S3 bucket listing has changed.
#
# The steps are the justfile's recipes, so a green `just check` on a laptop
# means the same thing as a green run here.

on:
  push:
    branches: [main]
    paths:
      - "landingpage/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "landingpage/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to gh-pages as well as building"
        type: boolean
        default: true

concurrency:
  # Queue rather than cancel on main: two pushes in quick succession would
  # otherwise race for the gh-pages branch and one would be lost. PRs only
  # build, so cancelling those is free.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

defaults:
  run:
    # The site's justfile, package.json and tox.ini live here.
    working-directory: landingpage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Depth 1 is enough: publishing writes a fresh parentless commit.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - uses: extractions/setup-just@v4

      - name: Install tox
        run: pip install tox

      - name: Verify the vendored shared docs match the pin
        # Fails if someone edited landingpage/shared/ directly. Those pages
        # are owned by grid-doctor; a local change would be silently
        # reverted by the next sync. First, because it is the cheapest.
        run: tox -e shared-check

      - uses: actions/cache@v6
        with:
          path: |
            landingpage/.prepared
            landingpage/.cache
            landingpage/.python-wheels
          key: prepared-${{ hashFiles('landingpage/package-lock.json', 'landingpage/scripts/prepare.mjs', 'landingpage/scripts/build_examples.py', 'landingpage/web/**', 'landingpage/examples/*.py', 'landingpage/notebooks/**', 'landingpage/assets/waterpark-datasets.json') }}

      - name: Prepare the Freva parts
        env:
          GH_TOKEN: ${{ secrets.HEALPIX_GEO_TOKEN || github.token }}
        run: just prepare

      - name: Build and check
        # The build checks every internal link and fails on a broken one,
        # as `mkdocs build --strict` did; then examples freshness and spelling.
        run: just check

      - name: Publish to gh-pages
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The site the step above built and checked, as one commit; what
          # `just deploy` runs after building. The VM does a shallow clone
          # that only ever pulls, so history there would be pure cost.
          ./scripts/publish-gh-pages.sh dist "docs: ${{ github.sha }}"

      - name: Upload the built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: landingpage/dist/
          retention-days: 7
