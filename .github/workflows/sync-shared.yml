name: sync-shared

# Bump the pinned copies of the shared pages from grid-doctor and open a
# pull request when they have moved. A PR rather than a direct push, so the
# upstream change is a reviewable diff and the docs build has to pass
# before it lands.
#
# Add a repository_dispatch trigger in grid-doctor if you want this to fire
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to pin to (default: the configured ref)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create Freva bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FREVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FREVA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pull the upstream shared docs
        working-directory: landingpage
        env:
          UPSTREAM_REF: ${{ inputs.ref }}
        run: |
          if [[ -n "$UPSTREAM_REF" ]]; then
            python scripts/sync_shared.py --update "$UPSTREAM_REF"
          else
            python scripts/sync_shared.py --update
          fi

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_SLUG: ${{ steps.bot-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          paths=(landingpage/shared landingpage/shared-sources.toml landingpage/shared.lock)

          # `git diff --quiet` ignores untracked files, so a page newly
          # adopted upstream would be missed. Ask git status instead.
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "shared docs already at the upstream tip"
            exit 0
          fi

          branch="chore/sync-shared"
          bot_login="${BOT_SLUG}[bot]"
          bot_id=$(gh api "users/${bot_login}" --jq '.id')
          pin=$(grep -m1 '^commit' landingpage/shared-sources.toml | cut -d'"' -f2)

          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- "${paths[@]}"
          git commit -m "docs: sync shared pages from grid-doctor@${pin:0:8}"
          # Force-push the same branch each run, so an already-open PR picks
          # up the new commit instead of a second PR being opened.
          git push --force origin "$branch"

          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Sync shared docs from grid-doctor" \
              --body "Automated bump of the \`landingpage/shared/\` pin in \`landingpage/shared-sources.toml\` to \`freva-org/grid-doctor@${pin:0:8}\`.
              These pages are owned upstream. If something here looks wrong, fix it in grid-doctor rather than in this PR."
          fi

          # Queue the PR for merging.
          #
          # Right after `gh pr create` (or a force-push) GitHub reports the
          # merge state as UNKNOWN while it recomputes mergeability. gh then
          # tries to enable auto-merge, and if GitHub settles on CLEAN in the
          # meantime the API refuses ("Pull request is in clean status") and
          # the job fails although the PR is fine. On the next run the state
          # is already CLEAN, gh merges directly, and the job goes green
          # again, which is why this only failed on days upstream moved.
          #
          # So: wait for a settled state first, then let gh decide between a
          # direct merge (CLEAN) and auto-merge (checks still pending), and
          # retry the race once or twice. The PR is the deliverable, so a
          # merge that still cannot be queued is a warning, not a failure.
          state=UNKNOWN
          for _ in $(seq 1 12); do
            state=$(gh pr view "$branch" --json mergeStateStatus --jq .mergeStateStatus)
            [[ "$state" != "UNKNOWN" ]] && break
            sleep 5
          done
          echo "merge state: $state"

          for attempt in 1 2 3; do
            if gh pr merge "$branch" --squash --auto; then
              exit 0
            fi
            echo "merge attempt $attempt failed, retrying"
            sleep 10
          done

          url=$(gh pr view "$branch" --json url --jq .url)
          echo "::warning title=sync-shared::Could not merge or enable auto-merge on ${url} (state: ${state}). The PR is open and needs a manual merge."
