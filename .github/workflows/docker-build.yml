---
name: Build and Push Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: rest-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate and extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME#v}"
          version="$(
            grep -oP \
              '__version__\s*=\s*"\K[^"]+' \
              rest-api/src/waterpark_api/__init__.py | tr -d '\n'
          )"

          if [[ -z "$version" ]]; then
            echo "::error::Could not extract __version__"
            exit 1
          fi

          echo "tag=$tag package=$version"

          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: rest-api
          file: rest-api/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/freva-org/waterpark-api:latest
            ghcr.io/freva-org/waterpark-api:${{ steps.version.outputs.version }}
