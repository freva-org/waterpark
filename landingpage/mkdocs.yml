site_name: Waterpark
site_description: The HEALPix Data Hub on s3
site_url: https://waterpark.dkrz.de
site_dir: site
docs_dir: .build/data

# Dropdown links below use the corresponding directory-style URLs.
use_directory_urls: true

theme:
  name: material
  custom_dir: data/overrides
  logo: assets/logo-512.png
  favicon: assets/favicon.ico

  icon:
    admonition:
      example: material/database
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.footer
    - search.highlight
    - search.suggest

# Appends a content digest to every local extra_css / extra_javascript
# entry so asset changes reach readers without a hard reload.
hooks:
  - scripts/cache_bust.py

plugins:

  # Header menus are configured separately from MkDocs navigation.
  # Keep these URLs aligned with the pages listed under nav.
  #
  # Root-relative URLs assume the site is served at /, as configured
  # by site_url above.
  - header-dropdown:
      dropdowns:
        - title: Find data
          links:
            - text: Data Browser
              url: /databrowser/
            - text: STAC Browser
              url: /stac-browser/

        - title: Examples
          links:
            - text: Start here
              url: /examples/
            - text: A map of one month
              url: /examples/01_first_map/
            - text: The global mean is just a mean
              url: /examples/02_global_mean/
            - text: Cutting out a region
              url: /examples/03_region_bbox/
            - text: Zonal means come for free
              url: /examples/04_zonal_mean/
            - text: Meridional means, and why they are harder
              url: /examples/05_meridional_mean/
            - text: A Hovmöller diagram
              url: /examples/06_hovmoeller/
            - text: Moving up and down the pyramid
              url: /examples/07_pyramid_levels/
            - text: Comparing two datasets without regridding
              url: /examples/08_cross_dataset/

        - title: Tips and tricks
          links:
            - text: High resolution data
              url: /high-level-access/

        - title: Concepts
          links:
            - text: HEALPix in Zarr on S3
              url: /storage_concepts/
            - text: Why HEALPix?
              url: /storage_concepts/why-healpix/
            - text: Why Zarr and S3?
              url: /storage_concepts/zarr-and-s3/
            - text: Remapping decisions
              url: /technical-decisions/
            - text: Remapping benchmark
              url: /appendix-remapping-benchmark/

        - title: Operation
          links:
            - text: Operator Tools
              url: /tools/

  - search
  - social:
      cards_layout_options:
        background_image: assets/modis-aqua.png

  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            scoped_crossrefs: true
            relative_crossrefs: true

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - md_in_html

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.arithmatex:
      generic: true

  - tables
  - attr_list
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.blocks.caption

  - toc:
      permalink: true

extra_css:
  - assets/styles.css
  - assets/waterpark-tree.css
  - assets/stac-browser.css
  - assets/databrowser.css
  - assets/waterpark-newsletter.css
  - assets/waterpark-focus.css
  - assets/waterpark-announce.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/waterpark-chrome.js
  - assets/stac-browser-loader.js
  - assets/databrowser-loader.js
  - assets/waterpark-tree.js
  - assets/waterpark-inspector.js
  - assets/waterpark-newsletter.js
  - assets/waterpark-focus.js
  - assets/header-navigation.js
  - assets/waterpark-announce.js

site_name: Waterpark
site_description: The HEALPix Data Hub on s3
site_url: https://waterpark.dkrz.de
site_dir: site
docs_dir: .build/data


copyright: >
  Need support? <a href="mailto:waterpark@support.dkrz.de">waterpark@support.dkrz.de</a>
  &nbsp;&middot;&nbsp;
  <a href="/newsletter/">Subscribe to the newsletter</a>

extra:
  # Empty in production: nginx serves the site and API on one origin.
  # Set WP_API_BASE by hand to point the docs at an API on another origin.
  api_base: !ENV [WP_API_BASE, ""]

  # DKRZ Datenschutzerklärung for the signup consent line.
  privacy_url: ""

  # Public listmonk list UUID, included in the generated page source.
  # .dev/compose.yml exports WP_LIST_UUID for the development list.
  # An empty value leaves signup unconfigured.
  list_uuid: !ENV [WP_LIST_UUID, ""]

  social:
    - icon: material/email
      link: mailto:waterpark@support.dkrz.de
      name: Support - waterpark@support.dkrz.de

# Retained for sidebar/mobile navigation and previous/next ordering.
nav:
  - Overview: index.md

  - Find data:
      - Data Browser: databrowser.md
      - STAC Browser: stac-browser.md

  - Examples:
      # Generated by scripts/build_examples.py into .build/data/examples/.
      - Start here: examples/index.md
      - A map of one month: examples/01_first_map.md
      - The global mean is just a mean: examples/02_global_mean.md
      - Cutting out a region: examples/03_region_bbox.md
      - Zonal means come for free: examples/04_zonal_mean.md
      - Meridional means, and why they are harder: examples/05_meridional_mean.md
      - A Hovmöller diagram: examples/06_hovmoeller.md
      - Moving up and down the pyramid: examples/07_pyramid_levels.md
      - Comparing two datasets without regridding: examples/08_cross_dataset.md

  - Tips and tricks:
      - High resolution data: high-level-access.md

  - Concepts:
      - HEALPix in Zarr on S3: storage_concepts/index.md
      - Why HEALPix?: storage_concepts/why-healpix.md
      - Why Zarr and S3?: storage_concepts/zarr-and-s3.md
      - Remapping decisions: technical-decisions.md
      - Remapping benchmark: appendix-remapping-benchmark.md

  - Operation:
      - Operator Tools: tools.md

# Avoid publishing raw Jinja templates copied into .build/data.
exclude_docs: |
  overrides/**

# Linked from the footer, intentionally omitted from navigation.
not_in_nav: |
  newsletter.md
