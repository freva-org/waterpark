# Serve the announcement banner straight off disk.
#
# No application behind it: the file IS the interface. Editing it is the
# whole publishing workflow, and the site picks the change up on the next
# page load.
#
#   ssh waterpark
#   sudoedit /var/lib/waterpark/announcements.json
#   waterpark-announce --check          # before you walk away
#
# Goes inside the existing `server { server_name waterpark.dkrz.de; }`,
# above the `location ~* \.(css|js|...)$` block.

location = /api/announcements {
    # `alias` on an exact-match location, so the URL and the filename need
    # not agree. The path is what the banner script already fetches, which
    # is why nothing in the built site changes.
    alias /var/lib/waterpark/announcements.json;

    default_type application/json;
    charset utf-8;

    # A minute. Long enough that a page-view burst does not stat the file
    # every time, short enough that "I edited it and nothing happened" is
    # never a question anyone has to ask.
    add_header Cache-Control "public, max-age=60" always;

    # If the file is absent the script hides the banner, which is the
    # correct behaviour for "there is nothing to announce". Returning an
    # empty document rather than 404 keeps that out of the error log.
    error_page 404 = @no_announcements;
}

location @no_announcements {
    default_type application/json;
    add_header Cache-Control "public, max-age=60" always;
    return 200 '{"announcements":[]}';
}
