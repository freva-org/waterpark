[tox]
min_version = 4.0
env_list = shared-check, examples-check, spell
# The site itself is built with npm (see the justfile); tox keeps the
# Python jobs around it, each in an environment of its own.

[testenv]
passenv = *
parallel_show_output = false
skip_install = true

[testenv:shared]
description = Re-pin the vendored shared docs to upstream tip.
deps =
commands = python scripts/sync_shared.py --update {posargs}

[testenv:shared-check]
description = Fail if the vendored shared docs were edited locally.
deps =
commands = python scripts/sync_shared.py --check

[testenv:spell]
description = Spell-check the pages and the example prose.
deps = codespell
commands = codespell {posargs: --quiet-level=2} src/content/docs shared examples

[testenv:examples]
description = Run the examples against the hub and refresh the figures.
deps =
    -r examples/requirements.txt
    pillow
commands = python scripts/build_examples.py --run {posargs}

[testenv:examples-check]
description = Report examples figures whose example has changed since.
deps =
commands = python scripts/build_examples.py --check
