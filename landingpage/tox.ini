[tox]
min_version = 4.0
env_list = shared-check, docs
[testenv]
passenv = *
parallel_show_output = false

# `static` copies real files, for a build whose output gets published.
# `serve` symlinks instead (cp -as) so mkdocs' watcher picks up an edit in
# data/ or shared/ without a re-copy.
[docs-prep]
static =
    rm -rf .build site
    mkdir -p .build/data
    cp -a data/. .build/data/
    cp -a shared/. .build/data/
    cp -a assets .build/data/

serve =
    rm -rf .build
    mkdir -p .build/data/assets
    cp -as {toxinidir}/data/. .build/data/
    cp -as {toxinidir}/shared/. .build/data/
    cp -as {toxinidir}/assets/. .build/data/assets/

[testenv:shared]
description = Re-pin the vendored shared docs to upstream tip.
skip_install = true
deps =
commands = python scripts/sync_shared.py --update {posargs}

[testenv:shared-check]
description = Fail if the vendored shared docs were edited locally.
skip_install = true
deps =
commands = python scripts/sync_shared.py --check

[testenv:docs]
description = Build the Waterpark docs into ./site.
allowlist_externals =
    rm
    cp
    mkdir
commands_pre = {[docs-prep]static}
skip_install = true
deps =
    -r requirements-docs.txt
    codespell
commands =
    python scripts/build_stac_browser_docs.py data
    python scripts/build_databrowser_docs.py data
    codespell {posargs: --quiet-level=2} data shared
    mkdocs build --strict

[testenv:docs-serve]
description = Serve the docs at localhost:8000 with live reload.
skip_install = true
allowlist_externals =
    rm
    cp
    mkdir
deps = {[testenv:docs]deps}
commands_pre = {[docs-prep]serve}
commands =
    python scripts/build_stac_browser_docs.py data
    python scripts/build_databrowser_docs.py data
    mkdocs serve -a localhost:8000 --watch data --watch shared --watch assets

[testenv:docs-deploy]
description = Publish ./site to the gh-pages branch. Normally CI-only.
allowlist_externals =
    rm
    cp
    mkdir
    git
skip_install = true
commands_pre = {[docs-prep]static}
deps = {[testenv:docs]deps}
commands =
    python scripts/build_stac_browser_docs.py data
    python scripts/build_databrowser_docs.py data
    mkdocs gh-deploy --force --no-history {posargs}
